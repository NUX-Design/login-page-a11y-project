<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เข้าสู่ระบบ | My Platform</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">MY PLATFORM · MEMBER ACCESS</p>
        <h1 id="page-title">ยินดีต้อนรับ<br />กลับมา</h1>
        <p class="intro-copy">
          เข้าสู่ระบบเพื่อเข้าถึงพื้นที่ทำงานและข้อมูลของคุณ
        </p>
        <div class="notice">
          <strong>ทุกอย่างพร้อมสำหรับคุณ</strong>
          <span>จัดการบัญชีและใช้งาน platform ต่อได้อย่างปลอดภัย</span>
        </div>
      </section>

      <section class="login-card" aria-label="แบบฟอร์มเข้าสู่ระบบ">
        <p class="card-kicker">MEMBER ACCESS</p>
        <h2>เข้าสู่ระบบ</h2>
        <p class="card-copy">กรอกข้อมูลเพื่อไปต่อ</p>

        <!-- Intentionally imperfect starter markup for the student exercise. -->
        <form id="login-form">
          <div class="field">
            <input id="email" type="text" placeholder="อีเมล" />
          </div>
          <div class="field">
            <input id="password" type="password" placeholder="รหัสผ่าน" />
          </div>
          <div class="form-row">
            <label class="remember"><input type="checkbox" /> จำฉันไว้</label>
            <a href="#forgot">ลืมรหัสผ่าน?</a>
          </div>
          <div class="submit-wrap">
            <div class="fake-submit" role="button">เข้าสู่ระบบ</div>
          </div>
          <p id="form-message" class="form-message"></p>
        </form>

        <p class="hint">ลองกด Tab และกดปุ่มเข้าสู่ระบบโดยไม่กรอกข้อมูล</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
